name: CI

on:
  push:
    branches:
      - master
      - main
      - v2-dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: envy
          POSTGRES_PASSWORD: envy
          POSTGRES_DB: envy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://envy:envy@localhost:5432/envy
      # API integration preload fills the rest; keep encryption key explicit for clarity
      SERVER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full-repo biome still has pre-existing noise outside the tested surface.
      # Gate format/lint on packages that own the test suite.
      - name: Biome (tested packages)
        run: >
          bunx biome check
          packages/crypto
          packages/db/src/roles.ts
          packages/db/src/roles.test.ts
          packages/db/src/services.ts
          packages/api
          packages/cli/src/core
          apps/web/src/utils

      - name: Typecheck
        run: bun run check-types

      - name: Apply database schema
        working-directory: packages/db
        run: bunx drizzle-kit push --force
        env:
          DATABASE_URL: postgres://envy:envy@localhost:5432/envy

      - name: Unit & integration tests
        run: bun run test
